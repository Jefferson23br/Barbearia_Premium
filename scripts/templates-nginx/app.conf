# Configuração Nginx - Painel do Cliente
# Arquivo: /etc/nginx/conf.d/app.conf
# Domínio: app.protesecapilarcuiaba.com.br

server {
    listen 80;
    server_name app.protesecapilarcuiaba.com.br;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.protesecapilarcuiaba.com.br;

    # SSL Certificate (será adicionado pelo Certbot)
    ssl_certificate /etc/letsencrypt/live/app.protesecapilarcuiaba.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.protesecapilarcuiaba.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Diretório raiz
    root /var/www/painel-cliente;
    index index.html;

    # Headers de Segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logs
    access_log /var/log/nginx/app.access.log;
    error_log /var/log/nginx/app.error.log;

    # Servir arquivos estáticos
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de arquivos estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Bloquear acesso a arquivos sensíveis
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
}

